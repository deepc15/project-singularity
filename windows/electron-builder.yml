appId: com.singular.desk
productName: Singular Desk
directories:
  output: release
files:
  - dist/**/*
  - package.json
win:
  target:
    - nsis
    - portable
  artifactName: SingularDesk-${version}-${arch}.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
